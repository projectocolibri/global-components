<main
  deltafilContainer
  direction="vertical"
  justify="start"
  gap="md"
  width="screen"
  height="screen"
  margin="md"
  padding="sm"
  rounded="lg"
  background="primary"
>
  <div
    deltafilContainer
    direction="horizontal"
    justify="start"
    gap="sm"
    padding="sm"
    width="auto"
    background="soft"
    rounded="md"
  >
    <button
      deltafilButton
      type="button"
      variant="secondary"
      (click)="toggleDarkMode()"
      [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
      [attr.aria-pressed]="themePreference() !== 'system' ? 'true' : 'false'"
    >
      <span class="inline-flex items-center gap-2">
        @if (isDark()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="size-5"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4" />
            <path
              d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
            />
          </svg>
          <span>Light Mode</span>
        } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            class="size-5"
            aria-hidden="true"
          >
            <path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z" />
          </svg>
          <span>Dark Mode</span>
        }
      </span>
    </button>
    <button
      deltafilButton
      type="button"
      variant="secondary"
      (click)="useSystemTheme()"
      aria-label="Use computer color scheme"
      [attr.aria-pressed]="themePreference() === 'system' ? 'true' : 'false'"
    >
      <span class="inline-flex items-center gap-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          class="size-5"
          aria-hidden="true"
        >
          <rect x="2" y="3" width="20" height="14" rx="2" />
          <path d="M8 21h8M12 17v4" />
        </svg>
        <span>System</span>
      </span>
    </button>
  </div>
  <h1 deltafilContainer direction="horizontal" justify="center" width="full">
    <span class="text-3xl font-bold">&#64;deltafil/components</span>
  </h1>
  <div
    deltafilContainer
    direction="horizontal"
    justify="center"
    gap="md"
    padding="md"
    width="full"
    background="soft"
    rounded="md"
  >
    <button deltafilButton type="button" grow>Primary</button>
    <button deltafilButton type="button" variant="secondary" grow>Secondary</button>
    <button deltafilButton type="button" variant="error" grow>Error</button>
  </div>
</main>

<router-outlet />
